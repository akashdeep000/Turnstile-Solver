services:
  turnstile-solver:
    build:
      context: .
      dockerfile: Docker/solver.Dockerfile
    image: turnstile-solver:latest
    container_name: turnstile-solver
    ports:
      - "5000:5000"
    environment:
      - DEBUG_SOLVER=false
      - DEFAULT_TIMEOUT=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s